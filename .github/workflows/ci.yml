name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    uses: polaris-trade/ci/.github/workflows/rust-ci.yml@main

  # guard feature-flag combos build + observability-core stays free of
  # opentelemetry/tracing-subscriber (heavy backends belong in leaf crate only).
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # pairwise coverage across both crates: every single feature + every pair + empty set.
      # depth 2 keeps combo count bounded as features grow; cargo-hack owns the enumeration.
      - name: feature powerset (depth 2)
        run: cargo hack --workspace --feature-powerset --depth 2 check

      # endpoints the depth-2 cap skips: shipped default set and everything on.
      - name: default + all features
        run: |
          cargo check -p observability
          cargo check -p observability --all-features

      - name: core dep boundary (no otel / tracing-subscriber in observability-core)
        run: |
          cargo tree -p observability-core | grep -Eq 'opentelemetry|tracing-subscriber' && { echo "observability-core dep boundary violated"; exit 1; } || echo "core boundary clean"
