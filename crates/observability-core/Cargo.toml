[package]
name = "observability-core"
description = "Runtime metrics gate and hot-path telemetry helpers (metrics + hdrhistogram only)"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
readme = "README.md"
keywords = ["observability", "metrics", "latency", "hot-path"]
categories = ["development-tools::profiling"]

[dependencies]
metrics = { workspace = true }
hdrhistogram = { workspace = true }
# flusher task only; leaf crate stays otel-free.
tokio = { workspace = true, optional = true }

[features]
# 100ms-tick flusher that drains histograms and emits gauges/counters.
flush-tokio = ["dep:tokio"]
