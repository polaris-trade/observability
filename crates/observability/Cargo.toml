[package]
name = "observability"
description = "Tracing + metrics backend wiring (subscriber pipeline, metrics recorder, shared OTLP) over observability-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
readme = "README.md"
keywords = ["observability", "tracing", "metrics", "opentelemetry", "otlp"]
categories = ["development-tools::debugging"]

[dependencies]
observability-core = { path = "../observability-core" }
# Always present: the facades + logging sinks.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
# otel grouping feature.
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
# per-signal / per-exporter.
opentelemetry-appender-tracing = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
metrics-exporter-otel = { workspace = true, optional = true }
tracing-bunyan-formatter = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

# Signal features are named to never collide with the `tracing` / `metrics` crate deps.
# `otel` is the grouping feature that pulls the SDK + OTLP transport; every
# `#[cfg(feature = "otel")]` block resolves against it.
[features]
default = ["logging", "otel", "metrics-prom"]
logging = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
otel-traces = ["otel"]
otel-logs = ["otel", "dep:opentelemetry-appender-tracing"]
metrics-prom = ["dep:metrics-exporter-prometheus"]
metrics-otel = ["otel", "dep:metrics-exporter-otel"]
bunyan = ["dep:tracing-bunyan-formatter"]
